services:
  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"

  backend:
    build: ./backend 
    ports: 
      - "5001:5000" 
    env_file: 
      - ./backend/.env 
    environment:
      PORT: 5000
      PERFORMANCE_AI_URL: http://ai-service:5000/predict
    depends_on:
      - ai-service

  frontend:
    build: ./frontend 
    ports: 
      - "3000:80" 

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 88b3469fb0e3874c57054d3ad2d9546ebf6de0de
  - name: moatazbench/pfe-frontend
    newTag: 88b3469fb0e3874c57054d3ad2d9546ebf6de0de
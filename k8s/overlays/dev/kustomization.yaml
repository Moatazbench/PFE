apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 92c169ed80a3d4b86dd35c33fa882df82aa6aaf9
  - name: moatazbench/pfe-frontend
    newTag: 92c169ed80a3d4b86dd35c33fa882df82aa6aaf9
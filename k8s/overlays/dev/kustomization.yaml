apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: 227754d1df035ad27ff929fcb1ae2b47b2d2e4fa
  - name: moatazbench/pfe-frontend
    newTag: 227754d1df035ad27ff929fcb1ae2b47b2d2e4fa
  - name: moatazbench/pfe-ai-service
    newTag: 227754d1df035ad27ff929fcb1ae2b47b2d2e4fa

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 3491a2397b83b335ce5f0fdeef1369ceece5c398
  - name: moatazbench/pfe-frontend
    newTag: 3491a2397b83b335ce5f0fdeef1369ceece5c398
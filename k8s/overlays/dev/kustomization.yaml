apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 628512a4022d0cc0534f4f9f1a23c93e12d3b143
  - name: moatazbench/pfe-frontend
    newTag: 628512a4022d0cc0534f4f9f1a23c93e12d3b143
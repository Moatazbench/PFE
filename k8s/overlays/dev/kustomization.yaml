apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 43808e9312407f1e0c07cae9fa27a7ddfdeb872c
  - name: moatazbench/pfe-frontend
    newTag: 43808e9312407f1e0c07cae9fa27a7ddfdeb872c
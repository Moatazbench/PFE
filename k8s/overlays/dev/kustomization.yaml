apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: bd2e6cfcfa03907652828e3bdb448d90a93140d6
  - name: moatazbench/pfe-frontend
    newTag: bd2e6cfcfa03907652828e3bdb448d90a93140d6
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: eb9b43d4dd08ed8b898f2718c12c8b6cff3d4483
  - name: moatazbench/pfe-frontend
    newTag: eb9b43d4dd08ed8b898f2718c12c8b6cff3d4483
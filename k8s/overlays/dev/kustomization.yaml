apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: b530f27eb1e8ed7e8bfa85620e03ab6a72431c2e
  - name: moatazbench/pfe-frontend
    newTag: b530f27eb1e8ed7e8bfa85620e03ab6a72431c2e
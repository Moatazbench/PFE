apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 60ca523a189036b0d12c6363eb962f9b6ad8c88d
  - name: moatazbench/pfe-frontend
    newTag: 60ca523a189036b0d12c6363eb962f9b6ad8c88d
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: 2303a23ec295a398045845da5605481103c5da3f
  - name: moatazbench/pfe-frontend
    newTag: 2303a23ec295a398045845da5605481103c5da3f
  - name: moatazbench/pfe-ai-service
    newTag: 2303a23ec295a398045845da5605481103c5da3f

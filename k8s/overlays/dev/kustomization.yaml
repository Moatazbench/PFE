apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: f62f04f929aacf608dfbb8a2d0a71efca07abefc
  - name: moatazbench/pfe-frontend
    newTag: f62f04f929aacf608dfbb8a2d0a71efca07abefc
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: 8ae716dd835a3b7578a459e4e2806280aed117b4
  - name: moatazbench/pfe-frontend
    newTag: 8ae716dd835a3b7578a459e4e2806280aed117b4
  - name: moatazbench/pfe-ai-service
    newTag: 8ae716dd835a3b7578a459e4e2806280aed117b4

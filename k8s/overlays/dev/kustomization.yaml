apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 6a44b09a1126e10d536e8ef6111f09d9394da15d
  - name: moatazbench/pfe-frontend
    newTag: 6a44b09a1126e10d536e8ef6111f09d9394da15d
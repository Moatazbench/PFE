apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 8d9c063d3f7124f88f35c41169ea05164f782b42
  - name: moatazbench/pfe-frontend
    newTag: 8d9c063d3f7124f88f35c41169ea05164f782b42
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: e1a668d9343bad188ce995dbe10f6c9f0be2f5f3
  - name: moatazbench/pfe-frontend
    newTag: e1a668d9343bad188ce995dbe10f6c9f0be2f5f3
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: c8379c9c0ee6a0f00df35f40a5f9e73ec8dd9a92
  - name: moatazbench/pfe-frontend
    newTag: c8379c9c0ee6a0f00df35f40a5f9e73ec8dd9a92
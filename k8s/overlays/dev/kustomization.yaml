apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: bc446120a1be956d8a5f9b24bc711e1da689e451
  - name: moatazbench/pfe-frontend
    newTag: bc446120a1be956d8a5f9b24bc711e1da689e451
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 48b83ef85f3c7684561e54bb63ba34c39e05c7c2
  - name: moatazbench/pfe-frontend
    newTag: 48b83ef85f3c7684561e54bb63ba34c39e05c7c2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: 9b1de6072df0cb35934b88d87078c355c84e8ae9
  - name: moatazbench/pfe-frontend
    newTag: 9b1de6072df0cb35934b88d87078c355c84e8ae9
  - name: moatazbench/pfe-ai-service
    newTag: 9b1de6072df0cb35934b88d87078c355c84e8ae9

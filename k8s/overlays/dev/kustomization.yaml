apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: d21258ea73c48a8f6e4381df5fe3257b27de3841
  - name: moatazbench/pfe-frontend
    newTag: d21258ea73c48a8f6e4381df5fe3257b27de3841
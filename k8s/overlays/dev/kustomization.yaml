apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 265fde4fd588b3fae4ab4757f8ad952d5d5c4c16
  - name: moatazbench/pfe-frontend
    newTag: 265fde4fd588b3fae4ab4757f8ad952d5d5c4c16
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: a936737542da7e3d9aa3ea54ef132fbf462172fa
  - name: moatazbench/pfe-frontend
    newTag: a936737542da7e3d9aa3ea54ef132fbf462172fa
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 655bb172ea1ffa6b8b59614879e400904502c764
  - name: moatazbench/pfe-frontend
    newTag: 655bb172ea1ffa6b8b59614879e400904502c764
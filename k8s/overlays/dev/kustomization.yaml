apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: eab69a46aefd3a66f4edea624f6c6a599f923d50
  - name: moatazbench/pfe-frontend
    newTag: eab69a46aefd3a66f4edea624f6c6a599f923d50
  - name: moatazbench/pfe-ai-service
    newTag: eab69a46aefd3a66f4edea624f6c6a599f923d50

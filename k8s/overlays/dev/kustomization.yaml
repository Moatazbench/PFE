apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: 1fe1003f0c4d0e6be75d6cf969c1584afab905e7
  - name: moatazbench/pfe-frontend
    newTag: 1fe1003f0c4d0e6be75d6cf969c1584afab905e7
  - name: moatazbench/pfe-ai-service
    newTag: 1fe1003f0c4d0e6be75d6cf969c1584afab905e7

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

  - path: ai-service-patch.yaml
    target:
      kind: Deployment
      name: ai-service

images:
  - name: moatazbench/pfe-backend
    newTag: c9b3bed2dae8946c4bc1e7198bb78563de390aa7
  - name: moatazbench/pfe-frontend
    newTag: c9b3bed2dae8946c4bc1e7198bb78563de390aa7
  - name: moatazbench/pfe-ai-service
    newTag: c9b3bed2dae8946c4bc1e7198bb78563de390aa7

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 62fe7bd91f766abced340be52e8a9b3abf850102
  - name: moatazbench/pfe-frontend
    newTag: 62fe7bd91f766abced340be52e8a9b3abf850102
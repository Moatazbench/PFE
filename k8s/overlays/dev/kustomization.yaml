apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: f41a2c291a56423ea85277ccd3523a269b37fd92
  - name: moatazbench/pfe-frontend
    newTag: f41a2c291a56423ea85277ccd3523a269b37fd92
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 4319201ed9eb8b9926ba8d121b78de55be1a5cd7
  - name: moatazbench/pfe-frontend
    newTag: 4319201ed9eb8b9926ba8d121b78de55be1a5cd7
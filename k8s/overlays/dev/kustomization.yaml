apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: 27a2a25a023cbd4d9c74860cec8a9f1a9a89b1a0
  - name: moatazbench/pfe-frontend
    newTag: 27a2a25a023cbd4d9c74860cec8a9f1a9a89b1a0
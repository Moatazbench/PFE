apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe-dev

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend

  - path: frontend-patch.yaml
    target:
      kind: Deployment
      name: frontend

images:
  - name: moatazbench/pfe-backend
    newTag: ae1e9fe5c75c94171c0a2095969fe5940064c76c
  - name: moatazbench/pfe-frontend
    newTag: ae1e9fe5c75c94171c0a2095969fe5940064c76c
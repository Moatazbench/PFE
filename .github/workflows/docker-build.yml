name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - develop
      - qa
      - staging
  pull_request:

jobs:

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================
  # 1️⃣ Backend Tests
  # =========================
  backend-tests:
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: backend-${{ runner.os }}-

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test


  # =========================
  # 2️⃣ Frontend Build Test
  # =========================
  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run frontend tests
        run: |
          cd frontend
          npm test


  # =========================
  # 3️⃣ Docker Build + GitOps
  # =========================
  docker:
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Validate Docker Credentials
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Docker Hub credentials not configured!"
            echo "Please add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to GitHub secrets"
            exit 1
          fi

      # ✅ Use SHA as immutable deployment tag
      - name: Set Image Tag
        id: vars
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # ✅ Build backend with buildx
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: moatazbench/pfe-backend:${{ steps.vars.outputs.TAG }},moatazbench/pfe-backend:latest
          load: ${{ github.event_name != 'push' }}

      # ✅ Build frontend with buildx
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: moatazbench/pfe-frontend:${{ steps.vars.outputs.TAG }},moatazbench/pfe-frontend:latest
          load: ${{ github.event_name != 'push' }}

      # ✅ Build AI Service with buildx
      - name: Build AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: ${{ github.event_name == 'push' }}
          tags: moatazbench/pfe-ai-service:${{ steps.vars.outputs.TAG }},moatazbench/pfe-ai-service:latest
          load: ${{ github.event_name != 'push' }}

      # ✅ DEV GitOps Auto Update
      - name: Update Kustomize image tag (DEV)
        if: github.ref_name == 'develop'
        run: |
          sed -i "s|newTag:.*|newTag: ${{ steps.vars.outputs.TAG }}|" k8s/overlays/dev/kustomization.yaml

      - name: Commit and Push Kustomize Update (DEV)
        if: github.ref_name == 'develop'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "ci: update dev image to ${{ steps.vars.outputs.TAG }}" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:develop

      # ✅ Security Scan (non-blocking)
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: moatazbench/pfe-backend:${{ steps.vars.outputs.TAG }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: moatazbench/pfe-frontend:${{ steps.vars.outputs.TAG }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Pipeline Summary
        if: always()
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend image: moatazbench/pfe-backend:${{ steps.vars.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend image: moatazbench/pfe-frontend:${{ steps.vars.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref_name == 'develop' && github.event_name == 'push'
    env:
      DEV_APP_URL: ${{ secrets.DEV_APP_URL }}
    steps:
      - name: Wait for deployment
        run: sleep 60
      - name: Health check
        run: |
          if [ -z "$DEV_APP_URL" ]; then
            echo "::warning::DEV_APP_URL secret is not set; skipping smoke test."
            echo "Set DEV_APP_URL to a reachable URL like https://your-dev-app.example.com"
            exit 0
          fi

          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "${DEV_APP_URL%/}/api/health"
